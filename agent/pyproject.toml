[project]
name = "sports-prediction-agent"
version = "0.1.0"
description = "Statistical + LLM ensemble prediction agent"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "httpx==0.28.1",
  "xai-sdk==1.2.0",
  "google-genai==1.2.0",
  "numpy==2.2.1",
  "scipy==1.15.0",
  "scikit-learn==1.6.0",
  "structlog==24.4.0",
  "python-dotenv>=1.1,<2"
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "mypy==1.14.1",
  "ruff==0.8.4",
]

[tool.uvicorn]
factory = false

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_any_unimported = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"
