services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sports_prediction_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sports_prediction_agent
      REDIS_URL: redis://redis:6379
      PORT: 4000
      HOST: 0.0.0.0
      AGENT_BASE_URL: http://agent:8000
    depends_on:
      - postgres
      - redis
      - agent
    ports:
      - "4000:4000"

  agent:
    build:
      context: ./agent
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sports_prediction_agent
      API_BASE_URL: http://api:4000
    depends_on:
      - postgres
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  redis_data:
